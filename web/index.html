<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OneNote PDF Indexer</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>OneNote PDF Indexer</h1>
          <p id="accountStatus">Checking Microsoft Graph connection...</p>
        </div>
        <button id="refreshButton" type="button">Refresh</button>
      </header>

      <section class="toolbar" aria-label="Search controls">
        <input id="queryInput" type="search" placeholder="Filter page titles in the selected section" />
      </section>

      <section class="grid">
        <aside class="panel" data-panel="left">
          <button class="panel-rail" data-expand-panel="left" type="button" title="Show notebooks and sections">Library &#8250;</button>
          <div class="panel-content">
            <div class="panel-titlebar">
              <h2>Library</h2>
              <button class="collapse-button" data-collapse-panel="left" type="button" title="Collapse library panel">&#8249;</button>
            </div>
            <h3>Notebooks</h3>
            <div id="notebooksList" class="list">Loading...</div>
            <h3>Sections</h3>
            <div id="sectionsList" class="list">Loading...</div>
          </div>
        </aside>

        <div class="splitter" data-splitter="left" role="separator" aria-orientation="vertical" title="Drag to resize panels"></div>

        <section class="panel" data-panel="middle">
          <button class="panel-rail" data-expand-panel="middle" type="button" title="Show pages">&#8250; Pages</button>
          <div class="panel-content">
            <div class="panel-titlebar">
              <h2>Pages</h2>
              <button class="collapse-button" data-collapse-panel="middle" type="button" title="Collapse pages panel">&#8249;</button>
            </div>
            <div id="pagesList" class="list">Select a section to load its pages.</div>
          </div>
        </section>

        <div class="splitter" data-splitter="right" role="separator" aria-orientation="vertical" title="Drag to resize panels"></div>

        <section class="panel" data-panel="right">
          <button class="panel-rail" data-expand-panel="right" type="button" title="Show embedded resources">&#8249; PDF</button>
          <div class="panel-content">
            <div class="panel-titlebar">
              <h2>Embedded Resources</h2>
              <button class="collapse-button" data-collapse-panel="right" type="button" title="Collapse PDF panel">&#8250;</button>
            </div>
            <div id="resourcesList" class="list">Select a page to inspect its PDF/image resources.</div>
          </div>
        </section>
      </section>

      <section class="control-dock" aria-label="View controls">
        <div class="control-group" role="group" aria-label="Resource view mode">
          <button id="viewPdfButton" class="mode-button active" type="button" title="Show embedded PDF">
            <span aria-hidden="true">&#9635;</span>
            PDF
          </button>
          <button id="viewTextButton" class="mode-button" type="button" title="Show extracted text">
            <span aria-hidden="true">&#9671;</span>
            Text
          </button>
          <button id="viewPageButton" class="mode-button" type="button" title="Show the OneNote page layout preview">
            <span aria-hidden="true">&#9638;</span>
            Page
          </button>
        </div>
        <div class="cache-progress" id="cacheProgress" title="Cache metrics are based on resources discovered locally so far.">
          <div class="cache-progress-text">
            <span id="cacheProgressLabel">Cache: assessing...</span>
            <span id="cacheProgressCount"></span>
          </div>
          <div class="cache-progress-track" aria-hidden="true">
            <div id="cacheProgressFill" class="cache-progress-fill"></div>
          </div>
        </div>
        <div class="control-group">
          <label class="select-control" title="Sort sections in the library panel">
            <span>Sections</span>
            <select id="sectionSortSelect">
              <option value="onenote">OneNote order</option>
              <option value="title">Title A-Z</option>
              <option value="modified-desc">Modified newest</option>
              <option value="modified-asc">Modified oldest</option>
            </select>
          </label>
          <label class="select-control" title="Sort pages in the selected section">
            <span>Pages</span>
            <select id="pageSortSelect">
              <option value="onenote">OneNote order</option>
              <option value="title">Title A-Z</option>
              <option value="modified-desc">Modified newest</option>
              <option value="modified-asc">Modified oldest</option>
              <option value="created-desc">Created newest</option>
              <option value="created-asc">Created oldest</option>
              <option value="pdf-first">PDF/cache first</option>
            </select>
          </label>
          <label class="select-control" title="Filter the page list by local cache state">
            <span>Cache</span>
            <select id="cacheFilterSelect">
              <option value="all">All pages</option>
              <option value="cached-pdfs">Cached PDFs</option>
              <option value="cached-pages">Cached pages</option>
            </select>
          </label>
          <button
            id="searchPdfButton"
            class="mode-button"
            type="button"
            title="Search extracted PDF text in the local cache. This can be slower than title filtering, so switch it on only when you need full-content search."
          >
            <span aria-hidden="true">&#9671;</span>
            Search PDF Text
          </button>
          <button id="fontSmallerButton" class="secondary-button icon-button" type="button" title="Make panel text smaller">A-</button>
          <button id="fontLargerButton" class="secondary-button icon-button" type="button" title="Make panel text larger">A+</button>
          <button id="sectionColorsButton" class="secondary-button" type="button" title="Toggle colored section edge markers">Section Colors</button>
          <button id="toggleDatesButton" class="secondary-button" type="button" title="Hide or show date metadata in library and page lists">Dates</button>
          <button id="resetLayoutButton" class="secondary-button" type="button">Reset Layout</button>
          <button id="refreshSelectedButton" class="secondary-button" type="button">Refresh Selected</button>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
